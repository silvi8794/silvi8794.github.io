<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Silvia Perez | Backend Developer (NestJS, Laravel)</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #1e1b2e, #0f172a);
      color: #e2e8f0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 50px 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header img {
      width: 120px;
      border-radius: 50%;
      border: 3px solid #f472b6;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 38px;
      margin: 10px 0;
    }

    .subtitle {
      color: #f472b6;
      font-weight: 500;
    }

    h2 {
      margin-top: 40px;
      color: #f472b6;
      font-size: 22px;
    }

    p {
      line-height: 1.7;
      color: #cbd5f5;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      padding: 20px;
      border-radius: 14px;
      margin-top: 15px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(244, 114, 182, 0.2);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    a {
      color: #f9a8d4;
      text-decoration: none;
      font-weight: 500;
    }

    .contact {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .lang-switch {
      text-align: right;
      margin-bottom: 20px;
    }

    .lang-switch button {
      background: transparent;
      border: 1px solid #f472b6;
      color: #f472b6;
      padding: 5px 10px;
      margin-left: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    .lang-switch button:hover {
      background: #f472b6;
      color: white;
    }

    ul {
      padding-left: 20px;
      margin-top: 10px;
      color: #cbd5f5;
    }

    li {
      margin-bottom: 6px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="lang-switch">
      <button onclick="setLang('es')">ES</button>
      <button onclick="setLang('en')">EN</button>
    </div>

    <div class="header">
      <img src="https://github.com/silvi8794.png" alt="Foto de Silvia">
      <h1>Silvia Andrea Perez</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>

    <h2 id="about-title"></h2>
    <p id="about-text"></p>

    <h2 id="stack-title"></h2>
    <p id="stack-text"></p>

    <h2 id="projects-title"></h2>

    <div class="card">
      <p><strong>E-commerce API</strong></p>
      <div id="project1-text"></div>
      <a href="https://github.com/silvi8794/nestjs-ecommerce-api" target="_blank" id="repo-link"></a>
    </div>

    <div class="card">
      <p><strong>Laravel API Training</strong></p>
      <div id="project2-text"></div>
      <a href="https://github.com/silvi8794/api-trainning" target="_blank" id="repo2-link"></a>
    </div>

    <h2 id="contact-title"></h2>

    <div class="contact">
      <a href="mailto:silvi8794@gmail.com" id="email-link">📧 Email</a>
      <a href="https://github.com/silvi8794" target="_blank">🐙 GitHub</a>
      <a href="https://www.linkedin.com/in/silvia-andrea-perez-b2a13120b/" target="_blank">💼 LinkedIn</a>

  </div>

        repo: "View repo →"

    function setLang(lang) {
      document.documentElement.lang = lang;
      document.getElementById("subtitle").innerText = content[lang].subtitle;
      document.getElementById("about-title").innerText = content[lang].aboutTitle;
      document.getElementById("about-text").innerText = content[lang].aboutText;
      document.getElementById("stack-title").innerText = content[lang].stackTitle;

      document.getElementById("projects-title").innerText = content[lang].projectsTitle;
      document.getElementById("project1-text").innerHTML = content[lang].project1Text;
      document.getElementById("project2-text").innerHTML = content[lang].project2Text;
      document.getElementById("contact-title").innerText = content[lang].contactTitle;
      document.getElementById("repo-link").innerText = content[lang].repo;
      document.getElementById("repo2-link").innerText = content[lang].repo;
      document.getElementById("email-link").innerText = content[lang].email;

</body>
</html>
