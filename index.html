<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silvia Perez | Backend Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rose: #f472b6;
      --rose-light: #fbcfe8;
      --rose-dark: #ec4899;
      --rose-glow: rgba(244, 114, 182, 0.25);
      --bg-dark: #0c0a1a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: rgba(244, 114, 182, 0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* --- NAV --- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 40px;
      background: rgba(12, 10, 26, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-name {
      font-weight: 700; font-size: 18px; color: var(--rose);
      letter-spacing: -0.5px;
    }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-links a, .nav-links button {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--text-secondary); text-decoration: none;
      transition: color 0.25s;
    }
    .nav-links a:hover, .nav-links button:hover { color: var(--rose); }
    .lang-btns { display: flex; gap: 6px; }
    .lang-btns button {
      padding: 4px 12px; border-radius: 6px;
      border: 1px solid var(--border) !important;
      font-size: 12px !important; font-weight: 600 !important;
    }
    .lang-btns button.active {
      background: var(--rose) !important; color: #fff !important;
      border-color: var(--rose) !important;
    }

    /* --- HERO --- */
    .hero {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; text-align: center;
      padding: 120px 30px 80px;
      position: relative;
    }
    .hero::before {
      content: ''; position: absolute; top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(244,114,182,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-content { position: relative; max-width: 700px; }
    .hero-img {
      width: 130px; height: 130px; border-radius: 50%;
      border: 3px solid var(--rose);
      box-shadow: 0 0 40px var(--rose-glow);
      margin-bottom: 28px;
      object-fit: cover;
    }
    .hero h1 {
      font-size: 48px; font-weight: 700;
      letter-spacing: -1.5px; margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 30%, var(--rose));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-role {
      font-size: 18px; color: var(--rose); font-weight: 500;
      margin-bottom: 20px;
    }
    .hero-desc {
      font-size: 16px; color: var(--text-secondary);
      max-width: 560px; margin: 0 auto 36px;
    }
    .hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 10px; font-size: 14px;
      font-weight: 600; text-decoration: none; transition: all 0.3s;
      border: none; cursor: pointer; font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--rose-dark), var(--rose));
      color: #fff; box-shadow: 0 4px 24px var(--rose-glow);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px var(--rose-glow); }
    .btn-outline {
      background: transparent; color: var(--text-primary);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-outline:hover { border-color: var(--rose); color: var(--rose); }

    /* --- SECTIONS --- */
    section { padding: 80px 30px; max-width: 900px; margin: 0 auto; }
    .section-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 3px; color: var(--rose); margin-bottom: 8px;
    }
    .section-title {
      font-size: 32px; font-weight: 700; letter-spacing: -1px;
      margin-bottom: 40px;
    }

    /* --- STACK --- */
    .stack-grid {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .stack-tag {
      padding: 8px 18px; border-radius: 8px; font-size: 13px;
      font-weight: 600; background: var(--bg-card);
      border: 1px solid var(--border); color: var(--text-secondary);
      transition: all 0.25s;
    }
    .stack-tag:hover {
      border-color: var(--rose); color: var(--rose);
      background: rgba(244,114,182,0.08);
    }

    /* --- PROJECTS --- */
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 32px;
      margin-bottom: 24px;
      transition: all 0.3s;
      position: relative; overflow: hidden;
    }
    .project-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .project-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .project-card:hover::before { opacity: 1; }
    .project-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 16px;
    }
    .project-name {
      font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
    }
    .project-desc {
      color: var(--text-secondary); font-size: 15px; margin-bottom: 18px;
    }
    .project-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .project-tag {
      font-size: 11px; font-weight: 600; padding: 4px 12px;
      border-radius: 6px; background: rgba(244,114,182,0.1);
      color: var(--rose-light); border: 1px solid rgba(244,114,182,0.15);
    }
    .project-features {
      list-style: none; padding: 0; margin-bottom: 20px;
    }
    .project-features li {
      position: relative; padding-left: 20px;
      margin-bottom: 8px; color: var(--text-secondary);
      font-size: 14px;
    }
    .project-features li::before {
      content: ''; position: absolute; left: 0; top: 9px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--rose);
    }
    .repo-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600; color: var(--rose);
      text-decoration: none; transition: gap 0.25s;
    }
    .repo-link:hover { gap: 10px; }

    /* --- CONTACT --- */
    .contact-section { text-align: center; }
    .contact-links {
      display: flex; gap: 16px; justify-content: center;
      flex-wrap: wrap; margin-top: 10px;
    }
    .contact-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 10px; font-size: 14px;
      font-weight: 500; color: var(--text-secondary); text-decoration: none;
      border: 1px solid var(--border); background: var(--bg-card);
      transition: all 0.25s;
    }
    .contact-link:hover {
      border-color: var(--rose); color: var(--rose);
      background: rgba(244,114,182,0.06);
    }

    /* --- FOOTER --- */
    footer {
      text-align: center; padding: 40px 30px; font-size: 13px;
      color: var(--text-secondary); border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    /* --- ANIMATIONS --- */
    .fade-in {
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      nav { padding: 14px 20px; }
      .nav-links { gap: 14px; }
      .hero h1 { font-size: 32px; }
      .hero { padding: 100px 20px 60px; }
      section { padding: 60px 20px; }
      .project-card { padding: 24px; }
      .contact-links { flex-direction: column; align-items: center; }
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav>

    <div class="nav-links">
      <a href="#stack" id="nav-stack"></a>

      <div class="lang-btns">

  <!-- HERO -->
  <div class="hero">

  <!-- PROJECTS -->

  <!-- CONTACT -->
  <section id="contact" class="contact-section">
    <p class="section-label fade-in" id="contact-label"></p>
    <h2 class="section-title fade-in" id="contact-title"></h2>
    <div class="contact-links fade-in">
      <a href="mailto:silvi8794@gmail.com" class="contact-link">📧 silvi8794@gmail.com</a>
      <a href="https://github.com/silvi8794" target="_blank" class="contact-link">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/silvia-andrea-perez-b2a13120b/" target="_blank" class="contact-link">LinkedIn ↗</a>
    </div>
  </section>

  <footer id="footer-text"></footer>

  <script>
    const content = {

        stackLabel: "Tecnologías",
        stackTitle: "Mi Stack",
        stackTags: [
          "NestJS", "Laravel", "TypeScript", "Node.js",

        projects: [
          {

            ],
            repo: "https://github.com/silvi8794/fincore"
          },
          {
            name: "E-commerce API",
            desc: "API REST escalable con arquitectura orientada a eventos y comunicación en tiempo real.",
            tags: ["NestJS", "TypeScript", "WebSockets", "Mercado Pago", "IA", "Redis", "JWT"],
            features: [
              "Arquitectura dirigida por eventos (EDA).",
              "Comunicación en tiempo real con WebSockets.",
              "Integración con Mercado Pago.",
              "Validación automatizada de pagos con IA (Google Gemini).",
              "Caching para optimización de rendimiento.",
              "Gestión de catálogos jerárquicos y stock por variantes.",
              "Seguridad con JWT y RBAC. Tests con Jest."
            ],
            repo: "https://github.com/silvi8794/nestjs-ecommerce-api"
          },
          {
            name: "Sistema de Gestión de Asistencias",
            desc: "API REST con arquitectura limpia, patrón Decorator y cobertura de tests.",
            tags: ["Laravel", "PHP", "Eloquent", "TDD", "SOLID"],
            features: [
              "Separación de capas mediante interfaces (Inversión de Dependencia — SOLID).",
              "Patrón Decorator para caché transparente que reduce accesos a BD.",
              "Tests unitarios aislados con TDD para fiabilidad y prevención de regresiones."
            ],
            repo: "https://github.com/silvi8794/api-trainning"
          }
        ],
        contactLabel: "Hablemos",
        contactTitle: "Contacto",
        footer: "© 2026 Silvia Perez — Backend Developer"
      },
      en: {
        navStack: "Stack",
        navProjects: "Projects",
        navContact: "Contact",
        heroRole: "Backend Developer — NestJS & Laravel",
        heroDesc: "I build robust, scalable and maintainable APIs applying best practices for high-performance systems.",
        btnProjects: "View projects",
        stackLabel: "Technologies",
        stackTitle: "My Stack",
        stackTags: [
          "NestJS", "Laravel", "TypeScript", "Node.js",
          "PostgreSQL", "MySQL", "MongoDB", "Redis",
          "Docker"
        ],
        projLabel: "Projects",
        projTitle: "Featured Work",
        projects: [
          {
            name: "FinCore",
            desc: "Modular and scalable banking core designed following Domain-Driven Design and Clean Architecture.",
            tags: ["NestJS", "PostgreSQL", "MongoDB", "Redis", "Docker", "Kubernetes", "DDD", "CQRS"],

              "Microservices architecture in independent Bounded Contexts: auth, accounts, payments, investments.",
              "Centralized API Gateway for service orchestration.",

            ],

          },
          {
            name: "E-commerce API",
            desc: "Scalable REST API with event-driven architecture and real-time communication.",
            tags: ["NestJS", "TypeScript", "WebSockets", "Mercado Pago", "AI", "Redis", "JWT"],
            features: [
              "Event-driven architecture (EDA).",
              "Real-time communication with WebSockets.",

          },
          {
            name: "Attendance Management System",
            desc: "REST API with clean architecture, Decorator pattern, and test coverage.",
            tags: ["Laravel", "PHP", "Eloquent", "TDD", "SOLID"],
            features: [
              "Layer separation via interfaces (Dependency Inversion — SOLID).",
              "Decorator pattern for transparent caching reducing DB access.",

            ],
            repo: "https://github.com/silvi8794/api-trainning"
          }
        ],
        contactLabel: "Get in touch",
        contactTitle: "Contact",
        footer: "© 2026 Silvia Perez — Backend Developer"
      }
    };

    const stackColors = {
      NestJS: "#e0234e", Laravel: "#ff2d20", TypeScript: "#3178c6",
      "Node.js": "#339933", PostgreSQL: "#4169e1", MySQL: "#4479a1",
      MongoDB: "#47a248", Redis: "#dc382d", Docker: "#2496ed",
      Kubernetes: "#326ce5", Prometheus: "#e6522c", Grafana: "#f46800",
      DDD: "#a78bfa", "Clean Architecture": "#a78bfa", CQRS: "#a78bfa"
    };

    function setLang(lang) {
      document.documentElement.lang = lang;
      const c = content[lang];

      document.getElementById("nav-stack").textContent = c.navStack;
      document.getElementById("nav-projects").textContent = c.navProjects;
      document.getElementById("nav-contact").textContent = c.navContact;
      document.getElementById("hero-role").textContent = c.heroRole;
      document.getElementById("hero-desc").textContent = c.heroDesc;
      document.getElementById("btn-projects").textContent = c.btnProjects;
      document.getElementById("stack-label").textContent = c.stackLabel;
      document.getElementById("stack-title").textContent = c.stackTitle;
      document.getElementById("proj-label").textContent = c.projLabel;
      document.getElementById("proj-title").textContent = c.projTitle;
      document.getElementById("contact-label").textContent = c.contactLabel;
      document.getElementById("contact-title").textContent = c.contactTitle;
      document.getElementById("footer-text").textContent = c.footer;

      document.getElementById("btn-es").classList.toggle("active", lang === "es");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");

      // Stack tags
      const grid = document.getElementById("stack-grid");
      grid.innerHTML = c.stackTags.map(t =>
        `<span class="stack-tag" style="border-color:${stackColors[t] ? stackColors[t]+'44' : 'var(--border)'}; color:${stackColors[t] || 'var(--text-secondary)'}">${t}</span>`
      ).join("");

      // Projects
      const plist = document.getElementById("project-list");
      plist.innerHTML = c.projects.map(p => `
        <div class="project-card fade-in">
          <div class="project-header">
            <span class="project-name">${p.name}</span>
          </div>
          <p class="project-desc">${p.desc}</p>
          <div class="project-tags">${p.tags.map(t =>
            `<span class="project-tag" style="background:${stackColors[t] ? stackColors[t]+'18' : 'rgba(244,114,182,0.1)'}; color:${stackColors[t] || '#fbcfe8'}; border-color:${stackColors[t] ? stackColors[t]+'33' : 'rgba(244,114,182,0.15)'}">${t}</span>`
          ).join("")}</div>
          <ul class="project-features">${p.features.map(f =>
            `<li>${f}</li>`
          ).join("")}</ul>
          <a href="${p.repo}" target="_blank" class="repo-link">${lang === 'es' ? 'Ver repositorio' : 'View repository'} →</a>
        </div>
      `).join("");

      observeFadeIns();
    }

    // Scroll fade-in
    function observeFadeIns() {
      const els = document.querySelectorAll('.fade-in');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
        });
      }, { threshold: 0.15 });
      els.forEach(el => obs.observe(el));
    }

    setLang('es');
  </script>
</body>
</html>
